<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox Render</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Waiting for content...</div>
    <iframe
      id="content"
      style="display: none"
      sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
    ></iframe>
    <script src="/scripts/sandbox-render.js"></script>
  </body>
</html>

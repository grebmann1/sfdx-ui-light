<template>
    <template lwc:if={showSalesforceContextBanner}>
        <div
            class="sf-panel-context-banner slds-p-around_x-small slds-theme_shade"
            role="status"
            aria-live="polite">
            <lightning-button
                class="sf-panel-context-banner__btn"
                icon-name="utility:salesforce1"
                label="Open Salesforce tools"
                onclick={handleOpenSalesforcePanel}
                variant="brand"></lightning-button>
        </div>
    </template>
    <template lwc:if={showBackToAppsBanner}>
        <div
            class="sf-panel-context-banner slds-p-around_x-small slds-theme_shade"
            role="status"
            aria-live="polite">
            <lightning-button
                class="sf-panel-context-banner__btn"
                label="Back to Workbench apps"
                onclick={handleBackToAppsPanel}
                variant="neutral"></lightning-button>
        </div>
    </template>
    <!-- Salesforce Panel -->
    <panels-salesforce
        class={salesforcePanelClass}
        is-back-button-displayed={isBackButtonDisplayed}
        lwc:ref="salesforce"
        onback={handleGoBack}
        onchangepanel={handlePanelChange}
        record-id={recordId}></panels-salesforce>
    <!-- Default Panel -->
    <panels-default
        class={defaultPanelClass}
        is-back-button-displayed={isBackButtonDisplayed}
        lwc:ref="default"
        onback={handleGoBack}
        onchangepanel={handlePanelChange}
        onapplicationchange={handleApplicationChange}></panels-default>
</template>

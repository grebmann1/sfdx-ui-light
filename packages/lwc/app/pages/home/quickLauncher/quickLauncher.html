<template>
    <div class="quick-launcher slds-card slds-m-top_small">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h1 class="slds-card__header-title quick-launcher__title">
                        <span>Quick Launcher</span>
                    </h1>
                </div>
            </header>
        </div>
        <div class="slds-card__body quick-launcher__body">
            <div class="quick-launcher__intro-row">
                <p class="quick-launcher__intro" role="status">
                    Launch key tools quickly. Start with
                    <strong class="quick-launcher__brand">Quick Connect</strong>
                    for a fast org login, or go to
                    <strong class="quick-launcher__brand">Connections</strong>
                    to manage all connection options.
                </p>
                <div class="quick-launcher__quick-connect">
                    <lightning-button
                        variant="brand"
                        icon-name="utility:link"
                        label="Quick Connect"
                        title="Quick Connect"
                        onclick={handleQuickConnect}></lightning-button>
                </div>
            </div>
            <div class="quick-launcher__grid">
                <!-- Explorers -->
                <div class="quick-launcher__category" lwc:if={hasExplorers}>
                    <h2 class="quick-launcher__category-title">Explorers</h2>
                    <div class="quick-launcher__list">
                        <template for:each={explorers} for:item="item">
                            <div
                                key={item.name}
                                class="quick-launcher__item"
                                role="button"
                                tabindex="0"
                                onclick={handleQuickAction}
                                onkeydown={handleItemKeydown}
                                data-path={item.path}>
                                <span class="quick-launcher__icon" aria-hidden="true">
                                    <lightning-icon
                                        icon-name={item.quickActionIcon}></lightning-icon>
                                </span>
                                <div class="quick-launcher__content">
                                    <span class="quick-launcher__label">{item.label}</span>
                                    <p class="quick-launcher__description">{item.description}</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <!-- Developer -->
                <div class="quick-launcher__category" lwc:if={hasDeveloperTools}>
                    <h2 class="quick-launcher__category-title">Developer</h2>
                    <div class="quick-launcher__list">
                        <template for:each={developerTools} for:item="item">
                            <div
                                key={item.name}
                                class="quick-launcher__item"
                                role="button"
                                tabindex="0"
                                onclick={handleQuickAction}
                                onkeydown={handleItemKeydown}
                                data-path={item.path}>
                                <span class="quick-launcher__icon" aria-hidden="true">
                                    <lightning-icon
                                        icon-name={item.quickActionIcon}></lightning-icon>
                                </span>
                                <div class="quick-launcher__content">
                                    <span class="quick-launcher__label">{item.label}</span>
                                    <p class="quick-launcher__description">{item.description}</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <!-- Data & Deploy -->
                <div class="quick-launcher__category" lwc:if={hasDataAndDeployTools}>
                    <h2 class="quick-launcher__category-title">Data &amp; Deploy</h2>
                    <div class="quick-launcher__list">
                        <template for:each={dataAndDeployTools} for:item="item">
                            <div
                                key={item.name}
                                class="quick-launcher__item"
                                role="button"
                                tabindex="0"
                                onclick={handleQuickAction}
                                onkeydown={handleItemKeydown}
                                data-path={item.path}>
                                <span class="quick-launcher__icon" aria-hidden="true">
                                    <lightning-icon
                                        icon-name={item.quickActionIcon}></lightning-icon>
                                </span>
                                <div class="quick-launcher__content">
                                    <span class="quick-launcher__label">{item.label}</span>
                                    <p class="quick-launcher__description">{item.description}</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <!-- Utilities -->
                <div class="quick-launcher__category" lwc:if={hasUtilities}>
                    <h2 class="quick-launcher__category-title">Utilities</h2>
                    <div class="quick-launcher__list">
                        <template for:each={utilities} for:item="item">
                            <div
                                key={item.name}
                                class="quick-launcher__item"
                                role="button"
                                tabindex="0"
                                onclick={handleQuickAction}
                                onkeydown={handleItemKeydown}
                                data-path={item.path}>
                                <span class="quick-launcher__icon" aria-hidden="true">
                                    <lightning-icon
                                        icon-name={item.quickActionIcon}></lightning-icon>
                                </span>
                                <div class="quick-launcher__content">
                                    <span class="quick-launcher__label">{item.label}</span>
                                    <p class="quick-launcher__description">{item.description}</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <!-- Plugins -->
                <div class="quick-launcher__category">
                    <h2 class="quick-launcher__category-title">Plugins</h2>
                    <div class="quick-launcher__list">
                        <div
                            class="quick-launcher__item"
                            role="button"
                            tabindex="0"
                            onclick={handleRedirection}
                            onkeydown={handleItemKeydown}
                            data-url="https://chromewebstore.google.com/detail/sf-toolkit-light/konbmllgicfccombdckckakhnmejjoei">
                            <span class="quick-launcher__icon" aria-hidden="true">
                                <lightning-icon icon-name="standard:apex_plugin"></lightning-icon>
                            </span>
                            <div class="quick-launcher__content">
                                <span class="quick-launcher__label">Chrome Extension</span>
                                <p class="quick-launcher__description">
                                    Extension improving the UX of admins/devs in Salesforce and
                                    authenticated redirection to Workbench.
                                </p>
                            </div>
                        </div>
                        <div
                            class="quick-launcher__item"
                            role="button"
                            tabindex="0"
                            onclick={handleRedirection}
                            onkeydown={handleItemKeydown}
                            data-url="https://github.com/grebmann1/sf-toolkit-desktop/releases">
                            <span class="quick-launcher__icon" aria-hidden="true">
                                <lightning-icon
                                    icon-name="standard:scheduling_workspace"></lightning-icon>
                            </span>
                            <div class="quick-launcher__content">
                                <span class="quick-launcher__label">Electron</span>
                                <p class="quick-launcher__description">
                                    Desktop version of the Workbench that integrates with your
                                    SFDX CLI and provides features such as PMD, etc.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<template>
    <div class="rn-layout">
        <!-- Left: Version List -->
        <div class="rn-sidebar">
            <div class="rn-sidebar__header">Versions</div>
            <ul class="rn-version-list">
                <template for:each={formattedReleases} for:item="release">
                    <li
                        key={release.key}
                        class={release.className}
                        data-version={release.version}
                        onclick={handleSelect}>
                        <div class="rn-version-item__main">
                            <span class="rn-version-item__version">v{release.version}</span>
                            <template if:true={release.isLatest}>
                                <span class="rn-badge rn-badge--latest">Latest</span>
                            </template>
                        </div>
                        <div class="rn-version-item__date">{release.date}</div>
                    </li>
                </template>
            </ul>
        </div>

        <!-- Right: Release Details -->
        <div class="rn-detail">
            <template lwc:if={selectedRelease}>
                <div class="rn-detail__header">
                    <div class="rn-detail__version-wrap">
                        <h2 class="rn-detail__version">v{selectedRelease.version}</h2>
                        <span class="rn-detail__date">{selectedRelease.date}</span>
                    </div>
                </div>

                <div class="rn-sections">
                    <template for:each={selectedRelease.sections} for:item="section">
                        <div key={section.key} class="rn-section">
                            <div class="rn-section__header">
                                <span class={section.badgeClass}>{section.title}</span>
                            </div>
                            <div class="rn-categories">
                                <template for:each={section.categories} for:item="category">
                                    <div key={category.key} class="rn-category">
                                        <div class="rn-category__name">{category.category}</div>
                                        <ul class="rn-item-list">
                                            <template for:each={category.items} for:item="item">
                                                <li key={item.key} class="rn-item">
                                                    <span class="rn-item__dot" aria-hidden="true"></span>
                                                    <span class="rn-item__text">{item.text}</span>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template lwc:else>
                <div class="rn-empty">Select a version to view release notes.</div>
            </template>
        </div>
    </div>
</template>

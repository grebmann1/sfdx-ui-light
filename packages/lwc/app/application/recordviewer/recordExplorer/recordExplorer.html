<template>
    <div class="slds-full-height slds-flex-column">
        <!-- Header -->
        <div class="slds-p-vertical_x-small slds-p-horizontal_small slds-shrink-none">
            <template lwc:if={isRecordIdAvailable}>
                <!-- After loading -->
                <template lwc:if={displayRecordHeader}>
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <div class="slds-col slds-has-flexi-truncate"></div>
                        <div class="toolbar">
                            <button
                                class="toolbar-btn"
                                disabled={isLoading}
                                onclick={handleRedirectDataExplorer}
                                title="Open in SOQL Explorer">
                                <slds-lucide-icon
                                    name="database-search"
                                    size="15"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </button>
                            <template lwc:if={isPanel}>
                                <button
                                    class="toolbar-btn"
                                    disabled={isLoading}
                                    onclick={handleRedirectToApp}
                                    title="Open in app">
                                    <slds-lucide-icon
                                        name="external-link"
                                        size="15"
                                        stroke-width="1.75"></slds-lucide-icon>
                                </button>
                            </template>
                            <button
                                class={infoButtonClass}
                                disabled={isLoading}
                                onclick={handleInfoToggle}
                                title="Toggle field info">
                                <slds-lucide-icon
                                    name="badge-info"
                                    size="15"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </button>
                            <button
                                class="toolbar-btn"
                                disabled={isLoading}
                                onclick={handleRefreshClick}
                                title="Refresh">
                                <slds-lucide-icon
                                    name="refresh-cw"
                                    size="15"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Record Info Card -->
                    <div class="record-info-card">
                        <div class="info-row">
                            <slds-lucide-icon
                                name="table-2"
                                size="12"
                                stroke-width="1.75"
                                class="info-icon"></slds-lucide-icon>
                            <span class="info-label">SObject</span>
                            <span class="info-value">
                                <a href={objectListLink}>{label}</a>
                                <span class="info-sep">/</span>
                                <span>{developerName}</span>
                                <button
                                    class="icon-btn"
                                    onclick={handleCopy}
                                    data-value={developerName}
                                    data-label="DeveloperName exported to your clipboard"
                                    title="Copy API name">
                                    <slds-lucide-icon
                                        name="clipboard-copy"
                                        size="11"
                                        stroke-width="1.75"></slds-lucide-icon>
                                </button>
                            </span>
                        </div>

                        <div class="info-row">
                            <slds-lucide-icon
                                name="id-card"
                                size="12"
                                stroke-width="1.75"
                                class="info-icon"></slds-lucide-icon>
                            <span class="info-label">Record Id</span>
                            <span class="info-value">
                                <span class="info-id-prefix">{keyPrefix}</span>
                                <span class="info-sep">/</span>
                                <span class="slds-truncate">{recordId}</span>
                                <button
                                    class="icon-btn"
                                    onclick={handleCopy}
                                    data-value={recordId}
                                    data-label="RecordId exported to your clipboard"
                                    title="Copy Record Id">
                                    <slds-lucide-icon
                                        name="clipboard-copy"
                                        size="11"
                                        stroke-width="1.75"></slds-lucide-icon>
                                </button>
                            </span>
                        </div>

                        <template lwc:if={recordTypeName}>
                            <div class="info-row">
                                <slds-lucide-icon
                                    name="layers-2"
                                    size="12"
                                    stroke-width="1.75"
                                    class="info-icon"></slds-lucide-icon>
                                <span class="info-label">Record Type</span>
                                <span class="info-value">{recordTypeName}</span>
                            </div>
                        </template>

                        <div class="info-row">
                            <slds-lucide-icon
                                name="link-2"
                                size="12"
                                stroke-width="1.75"
                                class="info-icon"></slds-lucide-icon>
                            <span class="info-label">Links</span>
                            <div class="info-links">
                                <a
                                    class="info-link"
                                    href={objectSetupLink}
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    Setup
                                </a>
                                <a
                                    class="info-link"
                                    href={objectFieldsSetupLink}
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    Fields
                                </a>
                                <a
                                    class="info-link"
                                    href={recordTypesLink}
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    Record Types
                                </a>
                                <a
                                    class="info-link"
                                    href={objectListLink}
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    List
                                </a>
                            </div>
                        </div>

                        <div class="info-row">
                            <slds-lucide-icon
                                name="book-open"
                                size="12"
                                stroke-width="1.75"
                                class="info-icon"></slds-lucide-icon>
                            <span class="info-label">Docs</span>
                            <span class="info-value">
                                <a href={objectDocLink} onclick={redirectDoc} target="_blank">
                                    {docLinkTitle}
                                </a>
                            </span>
                        </div>

                        <!-- Specific to Contacts -->
                        <template lwc:if={isNetworkMemberListDisplayed}>
                            <div class="info-row">
                                <slds-lucide-icon
                                    name="log-in"
                                    size="12"
                                    stroke-width="1.75"
                                    class="info-icon"></slds-lucide-icon>
                                <span class="info-label">Login as</span>
                                <span class="info-value">
                                    <template iterator:item={networkMembers}>
                                        <span class="slds-inline-flex" key={item.value.Id}>
                                            <a
                                                href={item.value._redirectLink}
                                                target="_blank">
                                                {item.value.Network.Name}
                                            </a>
                                            <template lwc:if={item.last}></template>
                                            <template lwc:else>
                                                <span class="info-sep">|</span>
                                            </template>
                                        </span>
                                    </template>
                                </span>
                            </div>
                        </template>
                    </div>
                </template>
            </template>
            <template lwc:elseif={isPanel}>
                <!-- Place Holder -->
                <illustration-empty
                    title="No record"
                    sub-title="The extension only support standard record pages."></illustration-empty>
            </template>
        </div>

        <!-- Loading -->
        <template lwc:if={isLoading}>
            <div class="slds-text-align_center slds-text-color_weak slds-p-horizontal_medium">
                <slds-spinner
                    alternative-text="Loading"
                    message="Fetching data from Salesforce"
                    size="small"></slds-spinner>
            </div>
        </template>
        <template lwc:elseif={isSaving}>
            <div class="slds-text-align_center slds-text-color_weak slds-p-horizontal_medium">
                <slds-spinner
                    alternative-text="Saving"
                    message="Updating data to Salesforce"
                    size="small"></slds-spinner>
            </div>
        </template>

        <!-- Table -->
        <template lwc:if={isRecordIdAvailable}>
            <div class="full-page-body tableFixHead slds-p-horizontal_x-small" onscroll={handleScroll}>
                <table
                    class="slds-table slds-table_cell slds-table_fixed-layout slds-table_bordered slds-table_resizable-cols slds-no-row-hover"
                    id="data-table"
                    role="grid">
                    <thead>
                        <tr class="slds-line-height_reset head">
                            <th
                                aria-label={fieldLabel}
                                aria-sort="none"
                                class="slds-is-sortable slds-is-resizable slds-text-title_caps"
                                draggable="false"
                                id="leftColumn"
                                scope="col">
                                <div class="slds-th__action slds-text-link_reset">
                                    <button
                                        class="icon-btn th-toggle-btn"
                                        onclick={handleToggleFieldName}
                                        title="Switch Field &amp; Label">
                                        <slds-lucide-icon
                                            name="columns-2"
                                            size="13"
                                            stroke-width="1.75"></slds-lucide-icon>
                                    </button>
                                    <span
                                        class="slds-truncate slds-m-left_x-small"
                                        title={fieldLabel}>
                                        {fieldLabel}
                                    </span>
                                </div>
                            </th>
                            <th
                                aria-label="Value"
                                aria-sort="none"
                                class="slds-is-sortable slds-is-resizable slds-text-title_caps"
                                scope="col">
                                <div class="slds-th__action slds-text-link_reset">
                                    <span class="slds-truncate" title="Value">Value</span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody
                        class="record-explorer-table slds-scrollable_y"
                        id="data-toDisplay"
                        onenableeditmode={handleEnabledEditMode}
                        onfieldchange={handleRowInputChange}>
                        <template for:each={virtualList} for:item="item">
                            <recordviewer-record-explorer-row
                                current-origin={currentOrigin}
                                field-errors={fieldErrors}
                                filter={filter}
                                is-info-displayed={isInfoDisplayed}
                                is-label-displayed={isLabelDisplayed}
                                is-visible={item.isVisible}
                                item={item}
                                key={item.name}
                                metadata={metadata}
                                record={record}></recordviewer-record-explorer-row>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- Edit mode footer -->
        <template lwc:if={isEditMode}>
            <div class="slds-editor-footer">
                <template lwc:if={isChangeMessageDisplayed}>
                    <div class="slds-grid slds-grid_align-center slds-p-top_x-small">
                        <p>
                            {modifiedRowsTotal} pending change(s)
                            <lightning-button
                                class="slds-m-left_x-small"
                                disabled={isSaving}
                                label={viewChangeLabel}
                                onclick={handleViewChanges_filter}
                                title={viewChangeLabel}
                                variant="base"></lightning-button>
                        </p>
                    </div>
                </template>

                <div class="slds-grid slds-grid_align-center slds-p-vertical_x-small">
                    <lightning-button
                        class="slds-float_left slds-button"
                        disabled={isCancelButtonDisabled}
                        label="Cancel"
                        onclick={handleCancelClick}
                        variant="neutral"></lightning-button>
                    <lightning-button
                        class="slds-button"
                        disabled={isSaveButtonDisabled}
                        label="Save"
                        onclick={handleSaveClick}
                        variant="brand"></lightning-button>
                </div>
                <div class="slds-grid slds-grid_align-center slds-p-bottom_x-small">
                    <p>(Record Editing is currently in beta phase)</p>
                </div>
            </div>
        </template>
    </div>
</template>

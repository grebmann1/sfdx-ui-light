<template>
    <tr class={rowClass} onfieldchange={handleInputChange} style="height: 0">
        <td class="cell-field slds-cell-wrap" lwc:dom="manual" lwc:ref="field"></td>
        <td class="cell-value slds-cell-wrap">
            <!-- Value -->
            <div class="slds-grid slds-grid_align-spread">
                <template lwc:if={isInfoDisplayed}>
                    <!-- INFO Mode -->
                    <span class="slds-scrollable_x type-badge" lwc:dom="manual" lwc:ref="type"></span>
                </template>
                <template lwc:else>
                    <!-- VALUE Mode -->
                    <template lwc:if={isReadOnly}>
                        <span class="slds-scrollable_x" lwc:dom="manual" lwc:ref="value"></span>
                    </template>
                    <template lwc:else>
                        <slds-input-field field-name={name} lwc:ref="inputfield"></slds-input-field>
                    </template>
                </template>
                <!-- Actions -->
                <div class="right-actions">
                    <template lwc:if={isDependentPicklistDisplayed}>
                        <button
                            class="row-icon-btn"
                            disabled={isLoading}
                            onclick={handleDependentPicklistClick}
                            title={tooltip_dependentPicklist}>
                            <slds-lucide-icon
                                name="git-merge"
                                size="13"
                                stroke-width="1.75"></slds-lucide-icon>
                        </button>
                    </template>
                    <template lwc:if={isInfoDisplayed}>
                        <!-- No extra actions in info mode -->
                    </template>
                    <template lwc:else>
                        <!-- Default actions -->
                        <template lwc:if={isUndoDisplayed}>
                            <button
                                class="row-icon-btn"
                                onclick={handleUndoClick}
                                title="Undo change">
                                <slds-lucide-icon
                                    name="rotate-ccw"
                                    size="13"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </button>
                        </template>
                        <template lwc:elseif={isEditButtonDisplayed}>
                            <button
                                class="row-icon-btn"
                                onclick={handleEditClick}
                                title="Edit field">
                                <slds-lucide-icon
                                    name="pencil-line"
                                    size="13"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </button>
                        </template>
                        <template lwc:elseif={isFormula}>
                            <button
                                class="row-icon-btn row-icon-btn_formula"
                                onclick={handleFormulaClick}
                                title={tooltip_formula}>
                                <slds-lucide-icon
                                    name="function-square"
                                    size="13"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </button>
                        </template>
                        <template lwc:elseif={isNotEditable}>
                            <span class="row-icon-btn row-icon-btn_locked" title="Read-only field">
                                <slds-lucide-icon
                                    name="lock-keyhole"
                                    size="13"
                                    stroke-width="1.75"></slds-lucide-icon>
                            </span>
                        </template>
                    </template>
                    <template lwc:if={isCopyDisplayed}>
                        <button
                            class="row-icon-btn"
                            onclick={handleCopyClick}
                            title="Copy value">
                            <slds-lucide-icon
                                name="clipboard-copy"
                                size="13"
                                stroke-width="1.75"></slds-lucide-icon>
                        </button>
                    </template>
                </div>
            </div>
        </td>
    </tr>
</template>

<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <a href="#" class="slds-card__header-link slds-truncate" title="Users">
                            <span>Users</span>
                        </a>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <!--<slot name="header-button"></slot>-->
                    <lightning-button
                        icon-name="utility:link"
                        label="Users"
                        onclick={goToUrl}
                        data-url="/lightning/setup/ManageUsers/home"></lightning-button>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-card__body_inner org-users-body">
            <div class="org-users-scroll slds-scrollable_y">
                <section class="org-users-panel" aria-label="User health overview">
                    <div class="org-users-summary">
                        <div class="org-users-summary-copy">
                            <p class="org-users-eyebrow">User health</p>
                            <h3 class="org-users-summary-title">{summaryHeadline}</h3>
                            <p class="org-users-summary-text">{summaryDescription}</p>
                        </div>
                        <div class="org-users-summary-badges" aria-label="User summary highlights">
                            <span class="org-users-badge org-users-badge-positive">
                                {activityRateLabel}
                            </span>
                            <span class="org-users-badge">{growthLabel}</span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </article>
</template>

<template>
    <div class={rootClass}>
        <section class={orgBannerClass} role="status" aria-live="polite">
            <div class="orgBannerContent">
                <div class="orgBannerTitleRow">
                    <strong class="orgBannerTitle">{orgBannerTitle}</strong>
                    <span class="betaBadge" title="Beta">Beta</span>
                </div>
            </div>
            <div class="orgBannerMeta">
                <template if:true={showOrgBanner}>
                    <template if:true={orgBannerHost}>
                        <span class="orgBannerHost">{orgBannerHost}</span>
                    </template>
                    <span class="orgBannerPill">{orgBannerEnvironmentLabel}</span>
                </template>
                <template if:true={showReconnectActions}>
                    <button
                        class="orgBannerActionButton"
                        type="button"
                        disabled={isReconnectBusy}
                        onclick={reconnectManually}>
                        Connect Manually
                    </button>
                    <button
                        class="orgBannerActionButton"
                        type="button"
                        disabled={isBrowserReconnectDisabled}
                        onclick={importBrowserOrg}>
                        <template if:true={canImportBrowserSession}>Use Browser Org</template>
                        <template if:false={canImportBrowserSession}>
                            Browser Org Unavailable
                        </template>
                    </button>
                </template>
                <button
                    class="themeToggleButton"
                    type="button"
                    title="Download workspace as zip"
                    aria-label="Download workspace as zip"
                    disabled={isDownloadingWorkspace}
                    onclick={downloadWorkspace}>
                    <slds-lucide-icon
                        class="themeToggleIcon"
                        name={downloadWorkspaceIcon}
                        size="15"></slds-lucide-icon>
                </button>
                <button
                    class="themeToggleButton"
                    type="button"
                    title={themeToggleTitle}
                    aria-label={themeToggleTitle}
                    onclick={toggleWorkbenchTheme}>
                    <template if:true={showLightModeIcon}>
                        <slds-lucide-icon
                            class="themeToggleIcon"
                            name="sun"
                            size="15"></slds-lucide-icon>
                    </template>
                    <template if:true={showDarkModeIcon}>
                        <slds-lucide-icon
                            class="themeToggleIcon"
                            name="moon"
                            size="15"></slds-lucide-icon>
                    </template>
                </button>
            </div>
        </section>

        <slds-auth-boundary
            is-loading={isAuthBoundaryLoading}
            suppress-session-recovery
            preserve-content-when-blocked
            title={authBoundaryTitle}
            sub-title={authBoundarySubtitle}>
            <div class="workbenchShell">
                <template if:true={showInitializationErrorOverlay}>
                    <div class="overlay overlayError" role="alert">
                        <strong>Failed to initialize VSCode workbench</strong>
                        <div class="errorText">{initializationError}</div>
                    </div>
                </template>

                <template if:true={showLoadingOverlay}>
                    <skeleton-loading-overlay
                        variant="dark"
                        message="Initializing VSCode workbench..."></skeleton-loading-overlay>
                </template>

                <div class="workbench-host">
                    <iframe
                        class="workbench-iframe"
                        src={workbenchIframeSrc}
                        title="Salesforce Workbench"
                        allow="keyboard-map"
                        onload={handleWorkbenchIframeLoad}></iframe>
                </div>
            </div>
        </slds-auth-boundary>
    </div>
</template>

<template>
    <div
        class="slds-publisher slds-is-active slds-p-left_small slds-p-right_small slds-p-bottom_x-small">
        <div class="slds-grid slds-wrap slds-grid_align-center">
            <div class="slds-col slds-size_1-of-1">
                <!--<label for="comment-text-input2" class="slds-publisher__toggle-visibility slds-m-bottom_small">To: Assistant </label>-->
                <div
                    class="chat-input-container file-upload-container"
                    ondragover={handleDragOver}
                    ondragleave={handleDragLeave}
                    ondrop={handleDrop}>
                    <div class="slds-flex-column slds-align-flex-end">
                        <div
                            class="chat-input-model-row slds-flex-row slds-grid slds-gutter_x-small">
                            <div class="slds-col">
                                <select
                                    id="model-picklist"
                                    class="slds-select chat-select chat-select-model"
                                    onchange={handleModelChange}
                                    aria-label="Model">
                                    <template for:each={renderedModelOptions} for:item="model">
                                        <option
                                            key={model.value}
                                            value={model.value}
                                            selected={model.isSelected}>
                                            {model.label}
                                        </option>
                                    </template>
                                </select>
                            </div>
                            <template lwc:if={showReasoningSelect}>
                                <div class="slds-col chat-reasoning-col">
                                    <slds-reasoning
                                        class="chat-reasoning-control"
                                        value={selectedReasoning}
                                        onchange={handleReasoningChange}></slds-reasoning>
                                </div>
                            </template>
                        </div>
                    </div>
                    <template lwc:if={hasFiles}>
                        <div class="chat-input-pills-row">
                            <template for:each={filePills} for:item="pill">
                                <div
                                    key={pill.file.name}
                                    class="chat-pill"
                                    tabindex="0"
                                    aria-label={pill.file.name}>
                                    <template lwc:if={pill.isImage}>
                                        <img
                                            src={pill.preview}
                                            alt="Image preview"
                                            class="chat-pill-thumbnail" />
                                        <span>Image</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="chat-pill-icon">📎</span>
                                        <span>{pill.file.name}</span>
                                    </template>
                                    <button
                                        class="chat-pill-remove"
                                        title="Remove file"
                                        aria-label="Remove file"
                                        data-filename={pill.file.name}
                                        onclick={removeSelectedFile}
                                        tabindex="0">
                                        ×
                                    </button>
                                </div>
                            </template>
                        </div>
                    </template>
                    <textarea
                        id="comment-text-input2"
                        class="chat-textarea"
                        placeholder="Write a prompt…"
                        onkeydown={handleKeyDown}
                        oninput={handleInputChange}
                        disabled={isLoading}
                        aria-label="Prompt input"></textarea>
                    <div class="chat-input-actions-row">
                        <div class="chat-input-actions-left">
                            <template lwc:if={isAudioRecorderDisplayed}>
                                <agent-audio-recorder
                                    openai-key={openaiKey}
                                    onchange={handleSpeechChange}></agent-audio-recorder>
                            </template>
                        </div>
                        <div class="chat-input-actions-right">
                            <lightning-button-group>
                                <lightning-button-icon
                                    icon-name="utility:attach"
                                    size="medium"
                                    variant="border-filled"
                                    alternative-text="Attach File"
                                    title="Attach File"
                                    onclick={triggerFileInput}
                                    disabled={isLoading}></lightning-button-icon>
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    size="medium"
                                    variant="border-filled"
                                    alternative-text="Clear"
                                    title="Clear"
                                    onclick={handleClearClick}
                                    disabled={isClearButtonDisabled}></lightning-button-icon>
                                <template lwc:if={isLoading}>
                                    <lightning-button-icon
                                        icon-name="utility:stop"
                                        size="medium"
                                        variant="border-filled"
                                        alternative-text="Stop"
                                        title="Stop"
                                        onclick={handleStopClick}></lightning-button-icon>
                                </template>
                                <template lwc:else>
                                    <lightning-button-icon
                                        icon-name="utility:send"
                                        size="medium"
                                        variant="border-filled"
                                        alternative-text="Send"
                                        title="Send"
                                        onclick={handleSendClick}></lightning-button-icon>
                                </template>
                            </lightning-button-group>
                        </div>
                        <input
                            type="file"
                            class="file-input"
                            onchange={handleFileChange}
                            aria-label="File input"
                            tabindex="-1"
                            multiple
                            accept="image/*,application/pdf" />
                    </div>
                    <template lwc:if={dragActive}>
                        <div class="file-upload-drag-overlay">Drop images here</div>
                    </template>
                </div>
                <!-- <div class="slds-publisher__actions slds-grid slds-grid_align-spread">
                    <ul class="slds-grid slds-publisher__toggle-visibility">
                        <li lwc:if={isAudioRecorderDisplayed}>
                            <agent-audio-recorder
                                openai-key={openaiKey}
                                onchange={handleSpeechChange}
                            ></agent-audio-recorder>
                        </li>
                    </ul>
                    <div>
                        <lightning-button
                            label="Clear Dialog"
                            onclick={handleClearClick}
                            disabled={isClearButtonDisabled}
                        ></lightning-button>
                        <lightning-button
                            label="Send"
                            onclick={handleSendClick}
                            disabled={isSendButtonDisabled}
                            class="slds-p-left_x-small"
                            variant="brand"
                        ></lightning-button>
                    </div>
                </div> -->
            </div>
        </div>
    </div>
</template>

<template>
    <div class="question-panel" role="dialog" aria-labelledby="question-panel-title">
        <div class="question-header">
            <lightning-icon
                icon-name="utility:question_mark"
                size="x-small"
                alternative-text="Question"
                class="question-header-icon"></lightning-icon>
            <span id="question-panel-title" class="question-header-title">Question</span>
        </div>

        <div class="question-body">
            <p class="question-text">{question}</p>

            <template lwc:if={hasOptions}>
                <div class="question-options" role="listbox" aria-label="Answer options">
                    <template for:each={formattedOptions} for:item="option">
                        <button
                            key={option.key}
                            type="button"
                            class={option.buttonClass}
                            data-index={option.index}
                            onclick={handleOptionClick}
                            role="option"
                            aria-selected={option.isSelected}>
                            <span class="question-option-label">{option.label}</span>
                            <span class="question-option-value">{option.value}</span>
                        </button>
                    </template>
                </div>
            </template>

            <div class="question-input-row slds-m-top_x-small">
                <input
                    type="text"
                    class="slds-input question-input"
                    placeholder={inputPlaceholder}
                    value={_freeText}
                    oninput={handleInputChange}
                    onkeydown={handleInputKeydown}
                    aria-label="Your answer" />
            </div>

            <div class="question-actions slds-m-top_small">
                <button type="button" class="question-skip-btn" onclick={handleSkip}>
                    Skip <span class="question-key-hint">Esc</span>
                </button>
                <button
                    type="button"
                    class="question-submit-btn"
                    disabled={isSubmitDisabled}
                    onclick={handleSubmit}>
                    Continue <span class="question-key-hint">↵</span>
                </button>
            </div>
        </div>
    </div>
</template>

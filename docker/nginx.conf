worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # =========================================================================
    # Domain-based routing (port 80)
    # Production: sf-toolkit.com, app.sf-toolkit.com, vscode.sf-toolkit.com,
    #             doc.sf-toolkit.com
    # =========================================================================

    # sf-toolkit.com → apps/ui (Vite SPA)
    server {
        listen 80;
        server_name sf-toolkit.com www.sf-toolkit.com;
        root /app/dist/ui;

        # Canonical redirect: /app and /app/<path> → app.sf-toolkit.com/<path>
        # Declared before the SPA catch-all so try_files doesn't swallow it.
        location ~ ^/app(/.*)?$ {
            return 301 https://app.sf-toolkit.com$1$is_args$args;
        }

        location /welcome/ {
            alias /app/dist/ui/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # app.sf-toolkit.com → packages/server (Express API + LWR web app)
    server {
        listen 80;
        server_name app.sf-toolkit.com;

        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # vscode.sf-toolkit.com → packages/vscode (Monaco/VS Code web IDE)
    server {
        listen 80;
        server_name vscode.sf-toolkit.com;
        root /app/packages/vscode/dist;

        # Required for SharedArrayBuffer (used by language server workers)
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }
    }

    # doc.sf-toolkit.com → apps/docs (Docusaurus)
    server {
        listen 80;
        server_name doc.sf-toolkit.com;
        root /app/dist/docs;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # Direct port access (local development / fallback)
    # =========================================================================

    # apps/docs — Docusaurus static site
    server {
        listen 4000;
        server_name _;
        root /app/dist/docs;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # apps/ui — Vite SPA
    # Built with UI_BASE_PATH=/welcome/, so JS/CSS assets are referenced as /welcome/ui-assets/...
    server {
        listen 5000;
        server_name _;
        root /app/dist/ui;

        location /welcome/ {
            alias /app/dist/ui/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # packages/vscode — Monaco/VS Code web IDE
    # Requires COEP/COOP headers for SharedArrayBuffer support
    server {
        listen 5173;
        server_name _;
        root /app/packages/vscode/dist;

        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }
    }
}

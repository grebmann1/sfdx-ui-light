[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; packages/server — Express API (proxy, OAuth, LLM, documentation search)
[program:server]
command=node -r dotenv/config packages/server/dist/server-prod.js
directory=/app
environment=NODE_ENV="production",PORT="3000"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; nginx — public front door on $PORT (Host-based subdomain routing)
;         plus internal fallback listeners on 4000/5000/5173.
;
; $PORT is injected by the platform (Heroku) or by docker-compose. We render
; the template into /tmp/nginx.conf (writable by non-root on Heroku), then
; exec nginx pointing at that file. envsubst is given an allow-list of '$PORT'
; so nginx's own $uri/$host/... runtime variables are left untouched.
[program:nginx]
command=/bin/sh -c "envsubst '$PORT' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -g 'daemon off;' -c /tmp/nginx.conf"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

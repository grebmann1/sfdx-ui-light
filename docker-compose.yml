services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sf-toolkit:latest
    ports:
      - "80:80"       # nginx front door — domain-based routing (production)
      - "3100:3000"   # packages/server  — Express API (proxy, OAuth, LLM)     (app.workbench-salesforce.com)
      - "4000:4000"   # apps/docs        — Docusaurus documentation   (doc.workbench-salesforce.com)
      - "5100:5000"   # apps/ui          — Vite welcome SPA            (workbench-salesforce.com)
      - "5173:5173"   # packages/vscode  — Monaco/VS Code web IDE      (vscode.workbench-salesforce.com)
    env_file:
      - .env
    # PORT here is ONLY consumed by nginx inside the container (the public
    # front door). The Express server's own PORT is pinned to 3000 by
    # supervisord (see docker/supervisord.conf [program:server]).
    # Overriding it here keeps nginx on 80 locally regardless of what .env
    # sets PORT to (it is 3000 for direct-run dev outside Docker).
    environment:
      PORT: "80"
    restart: unless-stopped
